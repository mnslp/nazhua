name: Validate Pull Requests

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 安装依赖
      - name: Install dependencies
        run: npm ci

      # 运行 ESLint
      - name: Run ESLint
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Check lazy-loaded assets
        run: npm run check:build
